<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Courses - Gestion des Menus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: url('background2.png');
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <h2 id="authTitle">Connexion</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Mot de passe</label>
                    <input type="password" id="passwordInput" required>
                </div>
                <div id="loginError" class="error-msg hidden"></div>
                <button type="submit" id="btnAuthSubmit" class="btn btn-primary" style="width:100%">Se
                    connecter</button>
            </form>
            <p style="text-align:center; margin-top: 16px;">
                <a href="#" id="toggleAuthMode" style="color: var(--primary)">Pas encore de compte ? Créer un compte</a>
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="app-container hidden">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-area">
                    <span class="material-symbols-rounded logo-icon">restaurant_menu</span>
                    <h1>Gestion des Menus</h1>
                </div>
                <div class="actions">
                    <a href="index.html" class="btn btn-secondary">
                        <span class="material-symbols-rounded">shopping_cart</span>
                        <span>Liste de courses</span>
                    </a>
                    <button id="btnResetMenus" class="btn btn-secondary">
                        <span class="material-symbols-rounded">refresh</span>
                        <span>Réinitialiser</span>
                    </button>
                    <button id="btnAddMenu" class="btn btn-primary">
                        <span class="material-symbols-rounded">add</span>
                        <span>Nouveau Menu</span>
                    </button>
                    <button id="btnLogout" class="btn btn-ghost" title="Se déconnecter">
                        <span class="material-symbols-rounded">logout</span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Category Filter Tabs -->
            <div class="filters-bar">
                <button id="filterAll" class="filter-tab active">Tous</button>
                <button id="filterRapide" class="filter-tab">🍳 Rapide</button>
                <button id="filterAperitif" class="filter-tab">🥂 Apéritif</button>
                <button id="filterGourmet" class="filter-tab">🍷 Gourmet</button>
                <button id="filterFamiliale" class="filter-tab">👨‍👩‍👧‍👦 Familiale</button>
                <button id="filterSemaine" class="filter-tab">📅 Semaine</button>
            </div>

            <div class="list-container">
                <div id="loading" class="loading-state">
                    <div class="spinner"></div>
                    <span>Chargement des menus...</span>
                </div>
                <div id="emptyState" class="empty-state hidden">
                    <span class="material-symbols-rounded" style="font-size: 48px; opacity: 0.5">restaurant_menu</span>
                    <p>Aucun menu créé.</p>
                    <p>Ajoutez votre premier menu !</p>
                </div>
                <div id="menusList" class="menus-list">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Menu Modal -->
    <div id="menuModal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nouveau Menu</h2>
                <button id="btnCloseModal" class="btn-icon" onclick="closeModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <form id="menuForm">
                <input type="hidden" id="menuId">
                <div class="form-group">
                    <label for="menuTitle">Titre du menu</label>
                    <input type="text" id="menuTitle" required placeholder="Ex: Pâtes Bolognaise">
                </div>
                <div class="form-group">
                    <label for="menuCategory">Catégorie</label>
                    <select id="menuCategory" required>
                        <option value="rapide">🍳 Rapide</option>
                        <option value="Apéritif">🥂 Apéritif</option>
                        <option value="gourmet">🍷 Gourmet</option>
                        <option value="familiale">👨‍👩‍👧‍👦 Familiale</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Note (étoiles)</label>
                    <div id="starsSelector" class="stars-selector">
                        <span class="star" data-value="1">☆</span>
                        <span class="star" data-value="2">☆</span>
                        <span class="star" data-value="3">☆</span>
                        <span class="star" data-value="4">☆</span>
                        <span class="star" data-value="5">☆</span>
                    </div>
                    <input type="hidden" id="menuStars" value="1">
                </div>
                <div class="form-group">
                    <label>Articles du menu</label>
                    <div class="article-selector">
                        <select id="rayonSelect">
                            <option value="">-- Sélectionner un rayon --</option>
                        </select>
                        <select id="articleSelect" disabled>
                            <option value="">-- Sélectionner un article --</option>
                        </select>
                        <button type="button" id="btnAddArticle" class="btn btn-sm btn-secondary" disabled>
                            <span class="material-symbols-rounded">add</span>
                        </button>
                    </div>
                    <div id="selectedArticles" class="selected-articles">
                        <!-- Chips injected by JS -->
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="btnCancel" class="btn btn-ghost">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add to Cart Modal -->
    <div id="addToCartModal" class="modal hidden">
        <div class="modal-backdrop" onclick="closeAddToCartModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="addToCartTitle">Ajouter au panier</h2>
                <button class="btn-icon" onclick="closeAddToCartModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div id="addToCartItems" class="add-to-cart-items">
                <!-- Checkboxes injected by JS -->
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-ghost" onclick="closeAddToCartModal()">Annuler</button>
                <button type="button" id="btnConfirmAddToCart" class="btn btn-primary">Ajouter au panier</button>
            </div>
        </div>
    </div>

    <script type="module" src="menus.js"></script>
</body>

</html>
